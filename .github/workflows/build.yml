name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.1]
        os: [macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      # Same steps as `yarn bootstrap`, but installs fail if package.json and
      # yarn.lock disagree instead of resolving new versions.
      - name: Install example app dependencies
        run: yarn example install --frozen-lockfile

      - name: Install library dependencies and build library
        run: yarn install --frozen-lockfile

      - name: Install example app pods
        run: yarn pods
